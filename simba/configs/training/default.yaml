# @package _global_
# Default training configuration

# Optimizer
optimizer:
  name: adam
  lr: 0.0001
  weight_decay: 0.0
  betas: [0.9, 0.999]

# Training loop
training:
  epochs: 1000
  batch_size: 128
  val_check_interval: 10000
  limit_val_batches: 1.0  # float (fraction) or int (num batches); 1.0 = full val set
  limit_train_batches: 1.0  # float (fraction) or int (num batches); 1.0 = full train set
  validate_after_ratio: 0.001
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  early_stopping_patience: 0  # 0 = disabled; set e.g. 5 to stop when val_loss stops improving

# Data splits
data:
  val_split: 0.1
  test_split: 0.1
  max_spectra_train: 1000
  max_spectra_val: 1000
  max_spectra_test: 1000

# Sampling & Uniformization
sampling:
  use_resampling: false
  use_uniform_data_training: false
  use_uniform_data_inference: true
  bins_uniformise_training: 10
  bins_uniformise_inference: 10

  # Add high similarity pairs
  add_high_similarity_pairs: false

  # Drop train/val pairs whose raw MCES distance equals this value exactly (null = keep all)
  exclude_mces_value: null

  # Add one molecule-paired-with-itself pair (MCES=0, ED=0) per molecule to every split
  add_identity_pairs: false

  # Precursor mass base value: "measured" (read PEPMASS from the MGF, historical
  # default) or "theoretical" (computed from SMILES via RDKit ExactMolWt + adduct
  # arithmetic, ignoring the MGF's own value).
  precursor_mass_mode: measured

  # Training-time precursor-mass noise, applied on top of precursor_mass_mode:
  # "legacy" (+/-1% uniform noise, historical default), "mist_cf" (MIST-CF/BUDDY-
  # style Gaussian noise scaled by instrument ppm tolerance / 5), or "none".
  precursor_noise_mode: legacy

# Augmentation
augmentation:
  enabled: false
  intensity_scale: [0.8, 1.2]
  peak_removal_prob: 0.1

# Hardware - default for production use
hardware:
  accelerator: gpu
  devices: 1
  num_workers: 10
  precision: "32-true"  # Lightning Trainer precision, e.g. "bf16-mixed" on bf16-capable GPUs
  strategy: "auto"  # Set to "ddp" for multi-process-per-node SLURM launches (srun + devices=1/task);
                     # "auto" picks SingleDeviceStrategy for devices=1, which does NOT pick up
                     # SLURM's rank/world-size env vars and makes every process think it's rank 0
                     # (each one then writes its own checkpoint/-v1/-v2/-v3 duplicates).
