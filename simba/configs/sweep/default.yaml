# @package _global_

sweep:
  n_trials: 10
  output_dir: ./sweeps/optuna_default
  resume: false
  study_name: simba_hyperparam_search
  params:
    optimizer.lr:
      type: loguniform
      low: 1.0e-5
      high: 1.0e-2

    model.transformer.d_model:
      type: categorical
      choices: [128, 256, 512]

    model.transformer.n_layers:
      type: int
      low: 3
      high: 8

    training.gradient_clip_val:
      type: uniform
      low: 0.5
      high: 2.0

    # Uncomment to add more params to the search:
    # training.batch_size:
    #   type: categorical
    #   choices: [64, 128, 256]
    #
    # model.transformer.dropout:
    #   type: uniform
    #   low: 0.0
    #   high: 0.3
    #
    # training.accumulate_grad_batches:
    #   type: categorical
    #   choices: [1, 2, 4]

  # Optional: seed the sweep with specific starting points that run as
  # the first trial(s) before TPE takes over. Ignored when resume=true.
  # starting_params:
  #   - optimizer.lr: 0.001
  #     model.transformer.d_model: 256
  #     model.transformer.n_layers: 5
  #     training.gradient_clip_val: 1.0
  #   - optimizer.lr: 0.0001
  #     model.transformer.d_model: 512
  #     model.transformer.n_layers: 3
  #     training.gradient_clip_val: 0.5
